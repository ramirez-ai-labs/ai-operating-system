# AI-OS Model Configuration
#
# Single source of truth for model IDs. `packages/shared/config/models.py`
# reads `providers.<name>.default_model` at import time, and every request
# schema, provider, agent, and eval runner takes its default model from there.
# Changing the default model is a one-line edit to this file.
#
# A request can still override the model per call via `claude_model` or
# `ollama_model`.

# ---------------------------------------------------------------------------
# Default provider (documentation — set on the request schemas, not read here)
# ---------------------------------------------------------------------------
# No model is called unless a request sets `use_model=True`; the default path
# is deterministic and needs no API key or local model.
#
# When `use_model=True` and no `provider` is passed:
#   - Director OS (`WeeklyUpdateRequest`)       → ollama
#   - Brand, Interview, One-on-One OS requests  → claude (Claude-only domains)
#   - `/orchestrate` (`OrchestratorRequest`)    → claude
# A Claude-only domain asked for a non-Claude provider falls back to the
# deterministic path when `fallback_to_deterministic=True` (the default).

# ---------------------------------------------------------------------------
# Provider tiers
# ---------------------------------------------------------------------------
providers:
  ollama:
    description: Local on-device inference via Ollama. No API key required.
    default_model: llama3.2
    base_url: http://127.0.0.1:11434
    use_cases:
      - Routing and intent classification
      - Low-stakes synthesis
      - Local development without API credentials
    cost: free

  claude:
    description: >
      Anthropic Claude via the Anthropic SDK. Requires ANTHROPIC_API_KEY.
      Uses tool use for structured output — grounded items with source citations
      are enforced at the API level, not just by prompt instruction.
    default_model: claude-haiku-4-5-20251001
    use_cases:
      - Structured weekly update synthesis
      - Evidence-grounded content drafts
      - High-fidelity outputs for leadership or public-facing use
    cost: api-key-required
    env_var: ANTHROPIC_API_KEY

# ---------------------------------------------------------------------------
# Model registry
# ---------------------------------------------------------------------------
# `validated: true` means the committed live eval results
# (evaluations/<domain>/results_claude.json) were produced with this model.
# Promote a model to `status: default` only after rerunning the live evals
# against it (`python scripts/run_evals.py --domain all --backend claude`)
# and committing the results.
models:
  ollama:
    - id: llama3.2
      tier: local
      status: default
      validated: true
      notes: Default local model. Fast and sufficient for deterministic routing.

  claude:
    - id: claude-haiku-4-5-20251001
      tier: synthesis
      status: default
      validated: true
      notes: Cost-effective default. Live evals pass on all four domains.
    - id: claude-haiku-5-5
      tier: synthesis
      status: available
      validated: false
      notes: Current-generation Haiku. Candidate replacement for the default once live evals are rerun.
    - id: claude-sonnet-5-5
      tier: premium
      status: available
      validated: false
      notes: Higher quality for complex or high-stakes synthesis. On-demand only.
    - id: claude-opus-5-5
      tier: premium
      status: available
      validated: false
      notes: Maximum quality. Reserve for evaluation baselines or critical runs.

# ---------------------------------------------------------------------------
# Fallback behavior
# ---------------------------------------------------------------------------
fallback:
  enabled: true
  strategy: deterministic
  description: >
    When model synthesis fails or returns weak output, the workflow falls back
    to the deterministic extraction path. This is controlled by
    `fallback_to_deterministic` on the request schema and is true by default.
    The fallback does not call any model — it extracts grounded items directly
    from retrieved evidence using keyword and prefix matching.
